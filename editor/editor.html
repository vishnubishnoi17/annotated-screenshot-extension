<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot Editor v2.0</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <div class="workspace">
    <aside class="history-panel" id="historyPanel">
      <h3>History</h3>
      <ul id="historyList"></ul>
    </aside>

    <main class="canvas-shell">
      <div class="floating-toolbar" id="toolbar">
        <div class="tool-group">
          <button data-tool="select" class="tool active">Select (V)</button>
          <button data-tool="arrow" class="tool">Arrow (A)</button>
          <button data-tool="rectangle" class="tool">Rectangle (R)</button>
          <button data-tool="ellipse" class="tool">Ellipse (E)</button>
          <button data-tool="text" class="tool">Text (T)</button>
          <button data-tool="blur" class="tool">Blur (B)</button>
          <button data-tool="highlight" class="tool">Highlight (H)</button>
        </div>

        <div class="tool-group compact">
          <label>Color <input type="color" id="color" value="#ef4444" /></label>
          <label>Width <input type="range" id="width" min="1" max="24" value="3" /></label>
          <span id="activeToolLabel">select</span>
        </div>

        <div class="tool-group compact">
          <button id="undo">Undo</button>
          <button id="redo">Redo</button>
          <button id="deleteSelected">Delete</button>
        </div>

        <div class="tool-group compact">
          <label><input id="includeAnnotations" type="checkbox" checked /> Include annotations</label>
          <select id="imageFormat">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
          </select>
          <button id="download">Download</button>
          <button id="copy">Copy</button>
          <button id="pdf">PDF</button>
        </div>

        <div class="tool-group compact">
          <button id="ocr">OCR</button>
          <button id="aiSuggest">AI Suggestions</button>
        </div>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <canvas id="canvas"></canvas>
      </div>
    </main>
  </div>

  <div class="modal hidden" id="textModal">
    <div class="modal-card">
      <h3>Add Text</h3>
      <input id="textInput" placeholder="Type annotation text" />
      <label>Size <input id="textSize" type="number" min="10" max="72" value="20" /></label>
      <div class="modal-actions">
        <button id="textCancel">Cancel</button>
        <button id="textApply">Apply</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="lab/jspdf.umd.min.js"></script>
  <script type="module" src="editor.js"></script>
</body>
</html>
