<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot Pro v2.0</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="header">
      <h1>Screenshot Pro</h1>
      <span class="badge">v2.0</span>
    </header>

    <section class="capture-actions">
      <button data-capture="fullpage">📸 Full page</button>
      <button data-capture="visible">👁️ Visible</button>
      <button data-capture="region">✂️ Region</button>
    </section>

    <section class="settings">
      <label>Delay
        <select id="delayMs">
          <option value="0">No delay</option>
          <option value="300" selected>0.3s</option>
          <option value="1000">1s</option>
          <option value="3000">3s</option>
        </select>
      </label>
      <small>Shortcut: Ctrl/Cmd+Shift+S (full page), Ctrl/Cmd+Shift+R (region)</small>
    </section>

    <section>
      <h2>Recent captures</h2>
      <ul id="history" class="history"></ul>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
